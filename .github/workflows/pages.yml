name: Deploy OriginMix to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix project-site paths
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            sed -i 's#/OriginWEB/#/OriginMix/#g' "$file"
            sed -i 's#/OriginWEB"#/OriginMix"#g' "$file"
            sed -i "s#/OriginWEB'#\/OriginMix'#g" "$file"
          done < <(find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' \) -print0)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
